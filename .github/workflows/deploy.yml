name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source files
        run: |
          echo "=== Checking Footer.tsx classes ==="
          grep -o 'flex flex-col items-center' src/components/Footer.tsx || echo "Classes NOT found in source!"
          echo "=== Last commit ==="
          git log -1 --oneline

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Checking built HTML for classes ==="
          grep -o 'flex flex-col items-center' out/index.html | head -3 || echo "Classes NOT found in build!"
          echo "=== Files in out/ ==="
          ls -la out/

      - name: List FTP root directory
        run: |
          curl -s --ftp-ssl-reqd -u "${{ secrets.FTP_USER_TRIOLAB }}:${{ secrets.FTP_PASSWORD_TRIOLAB }}" "ftp://${{ secrets.FTP_HOST_TRIOLAB }}/" --list-only || echo "SSL failed, trying plain FTP..."
          curl -s -u "${{ secrets.FTP_USER_TRIOLAB }}:${{ secrets.FTP_PASSWORD_TRIOLAB }}" "ftp://${{ secrets.FTP_HOST_TRIOLAB }}/" --list-only || echo "FTP listing failed"
          echo "=== Trying public_html ==="
          curl -s -u "${{ secrets.FTP_USER_TRIOLAB }}:${{ secrets.FTP_PASSWORD_TRIOLAB }}" "ftp://${{ secrets.FTP_HOST_TRIOLAB }}/public_html/" --list-only || echo "public_html listing failed"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_TRIOLAB }}
          username: ${{ secrets.FTP_USER_TRIOLAB }}
          password: ${{ secrets.FTP_PASSWORD_TRIOLAB }}
          local-dir: ./out/
          server-dir: public_html/
          dangerous-clean-slate: true
          log-level: verbose
