name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST_TRIOLAB }}
          username: ${{ secrets.FTP_USER_TRIOLAB }}
          password: ${{ secrets.FTP_PASSWORD_TRIOLAB }}
          local-dir: ./out/
          server-dir: ./
          dangerous-clean-slate: true
